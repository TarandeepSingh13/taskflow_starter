<header class="topbar">
  <a class="brand" href="#" aria-label="TaskFlow home">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24">
        <path d="m5 12 4.2 4.2L19 6.8" />
      </svg></span>
    <span>Taskflow<span class="brand-dot">.</span></span>
  </a>
  <div class="header-actions">
    <button class="icon-button theme-toggle" id="theme-toggle" aria-label="Switch theme" title="Switch theme">
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
      </svg>
    </button>
    <div class="profile-wrap">
      <button class="profile-button" id="profile-button" aria-expanded="false" aria-controls="profile-menu">
        <span class="avatar">Y</span><span class="profile-name">You</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 10 5 5 5-5" />
        </svg>
      </button>
      <div class="profile-menu" id="profile-menu" hidden>
        <p class="profile-menu-label">YOUR WORKSPACE</p>
        <p class="profile-menu-name">My tasks, my pace.</p>
        <button id="menu-theme" class="menu-action">Switch appearance</button>
      </div>
    </div>
  </div>
</header>
